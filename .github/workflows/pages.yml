name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # NEXT_PUBLIC_* values are inlined at build time.
      #
      # The contact endpoint is deliberately empty. It used to point at
      # https://marketing.gamedayhuddle.com/api/contact, and that host was
      # deleted on 20 Aug 2026: every submission — organization sales enquiries
      # included — spent a failed request on a dead name before falling back.
      # Empty, the form goes straight to the fallback: the same message,
      # prepared in the visitor's own mail client, which they send themselves.
      # Refill this only when a relay is actually deployed and answering, and
      # remember it must be CORS-simple (see the note in ContactForm.tsx).
      - run: npm run export:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://www.gamedayhuddle.com
          NEXT_PUBLIC_CONTACT_ENDPOINT: ""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
